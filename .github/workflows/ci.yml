name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

# D91: cancel PRs, queue main. Cancellation propagates into called workflows,
# so a main-branch cancel would kill a deploy mid-run — the 2026-08-31 outage.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# D51: no shared-install job — the pnpm store cache makes a per-job install
# cheaper than passing node_modules around as an artifact.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No AWS credentials here: the sst.config.ts/infra step needs
      # .sst/platform types from a local deploy, so it skips cleanly.
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # D34: fails on a removed field/narrowed type/removed enum value in
      # packages/shared's zod contracts. Additive changes pass silently.
      - name: Check schema snapshot
        run: pnpm --filter @techtok/shared run schema:check

  mobile-icon-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the staleness check walks full path history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # D59: catches a source icon/splash image drifting from the committed
      # android/ project (D30/D18). Compares commit recency, not pixels — a
      # regenerated PNG is never byte-identical across architectures.
      - name: Check Android icon/splash assets are in sync
        run: |
          set -euo pipefail

          check_not_stale() {
            local label="$1" source_pathspec="$2" output_pathspec="$3"
            local source_ts output_ts
            source_ts=$(git log -1 --format=%ct -- $source_pathspec)
            output_ts=$(git log -1 --format=%ct -- $output_pathspec)
            if [ -z "$output_ts" ]; then
              echo "::error::No commit history found for $label's committed output ($output_pathspec) — has apps/mobile/android ever been prebuilt?"
              exit 1
            fi
            if [ -n "$source_ts" ] && [ "$source_ts" -gt "$output_ts" ]; then
              echo "::error::$label: the source image changed more recently than the committed android/ output. Run 'pnpm --filter mobile prebuild:android -- --clean' and commit the regenerated files."
              exit 1
            fi
            echo "$label: OK"
          }

          check_not_stale "Splash image" \
            "apps/mobile/assets/images/splash-icon.png" \
            "apps/mobile/android/app/src/main/res/drawable-*/splashscreen_logo.png"

          check_not_stale "Launcher icon" \
            "apps/mobile/assets/images/android-icon-foreground.png apps/mobile/assets/images/android-icon-background.png apps/mobile/assets/images/android-icon-monochrome.png" \
            "apps/mobile/android/app/src/main/res/mipmap-*/ic_launcher*.webp apps/mobile/android/app/src/main/res/mipmap-anydpi-v26/*.xml"

          # By value, not commit recency: every version bump touches
          # app.json, which would make a recency check permanently stale.
          APP_NAME=$(jq -r '.expo.name' apps/mobile/app.json)
          STRINGS_APP_NAME=$(grep -o 'name="app_name">[^<]*' apps/mobile/android/app/src/main/res/values/strings.xml | sed 's/.*>//')
          if [ "$APP_NAME" != "$STRINGS_APP_NAME" ]; then
            echo "::error::apps/mobile/android/app/src/main/res/values/strings.xml's app_name ('$STRINGS_APP_NAME') doesn't match app.json's expo.name ('$APP_NAME'). Run 'pnpm --filter mobile prebuild:android -- --clean' and commit the change."
            exit 1
          fi
          echo "app_name: OK"

          # By value, same reason as app_name above.
          RUNTIME_VERSION=$(jq -r '.expo.runtimeVersion' apps/mobile/app.json)
          STRINGS_RUNTIME_VERSION=$(grep -o 'name="expo_runtime_version">[^<]*' apps/mobile/android/app/src/main/res/values/strings.xml | sed 's/.*>//')
          if [ "$RUNTIME_VERSION" != "$STRINGS_RUNTIME_VERSION" ]; then
            echo "::error::apps/mobile/android/app/src/main/res/values/strings.xml's expo_runtime_version ('$STRINGS_RUNTIME_VERSION') doesn't match app.json's expo.runtimeVersion ('$RUNTIME_VERSION'). Run 'pnpm --filter mobile prebuild:android -- --clean' and commit the change."
            exit 1
          fi
          echo "expo_runtime_version: OK"

  mobile-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mobsfscan
        run: pip install mobsfscan
      # Release manifest only (debug's cleartext/allowBackup flags never
      # ship). No -w: only ERROR-severity findings fail the build.
      # apps/mobile/.mobsf documents the suppressions.
      - name: Scan apps/mobile for security issues
        run: |
          mobsfscan \
            apps/mobile/src \
            apps/mobile/android/app/src/main \
            apps/mobile/app.json \
            apps/mobile/eas.json \
            -c apps/mobile/.mobsf

  # From here down: the main-branch release pipeline (D46/D98/D99, reshaped by
  # D100 into two chains that run in parallel, and by D109 to drop the
  # OTA-only path and decouple the site deploy):
  #
  #   deploy-dev ─→ e2e ─→ deploy-production ─→ deploy-site
  #
  #   checks ─→ mobile-changes ─→ mobile-version-bump ─┬─→ mobile-build
  #                                                     └─→ mobile-play-release
  #
  #   deploy-site needs only deploy-production, so it runs in parallel with
  #   the whole mobile chain; release-cleanup needs mobile-build.
  #
  # D100: the mobile chain reads the API URL from the PRODUCTION_API_URL repo
  # variable instead of deploy-production's output, so the ~10min native
  # builds overlap the deploy and e2e instead of queueing behind them. Each
  # stage is a reusable workflow, also runnable standalone. Permissions narrow
  # down a call chain, so every caller job below must re-declare what its
  # nested workflow needs or GitHub caps it to none.
  #
  # D52: deploy-dev has NO `needs` — it races the quality jobs, taking itself
  # and e2e off the far side of the check fan-out. `dev` is throwaway, so a
  # commit that turns out to fail lint costs nothing there. deploy-production
  # re-imposes the gate (e2e AND all six checks); the mobile chain, which no
  # longer runs behind it, states that same gate itself.
  deploy-dev:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-dev.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  e2e:
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  deploy-production:
    needs: [e2e, lint, typecheck, test, schema-check, mobile-icon-check, mobile-security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  # D53: does this merge need a new APK/AAB at all? Baselined against the
  # newest `mobile-v*` tag, so the question is "anything mobile-relevant
  # since the APK releases/latest serves", which accumulates correctly across
  # skipped runs. D109: should_build fires on ANY apps/mobile or
  # packages/shared change, native or JS — there is no cheaper OTA-only path
  # anymore, every mobile change goes through the full mobile-build +
  # mobile-play-release pipeline. A path heuristic, not a fingerprint: worst
  # case is a wasted rebuild.
  #
  # D100: needs the six checks directly — it used to inherit that gate through
  # mobile-build's `needs: deploy-production`, which the repo-variable API URL
  # removed. Without it a merge failing lint would still cut a release.
  mobile-changes:
    needs: [lint, typecheck, test, schema-check, mobile-icon-check, mobile-security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      # fetch-depth: 0 for the tags and the commit ranges below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # D100: an unset variable isn't a build failure — it ships an APK/AAB
      # pointing at nothing. Fail the whole mobile chain here, once.
      - name: Check PRODUCTION_API_URL is set
        run: |
          if [ -z "${{ vars.PRODUCTION_API_URL }}" ]; then
            echo "::error::The PRODUCTION_API_URL repository variable is not set — every mobile build would bake an empty EXPO_PUBLIC_API_URL. See README.md's Required repository variables table (D100)."
            exit 1
          fi

      - id: check
        run: |
          set -euo pipefail
          # Same ordering bumpMobileVersion.ts uses. for-each-ref --count=1
          # not `git tag | head -1`: SIGPIPE would fail the step under pipefail.
          BASE=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/mobile-v*')
          if [ -z "$BASE" ]; then
            echo "No mobile-v* tag exists yet — building (fail open)."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # D109: any apps/mobile change, native or JS-only, triggers a full
          # rebuild — there's no separate OTA-only path anymore. packages/shared
          # ships inside the app; pnpm-lock.yaml covers a dependency bump that
          # changes the bundle without touching app code.
          MOBILE_CHANGED=$(git diff --name-only "$BASE"..HEAD -- \
            apps/mobile \
            packages/shared \
            pnpm-lock.yaml \
            .github/workflows/mobile-build.yml \
            .github/workflows/mobile-release.yml)
          if [ -n "$MOBILE_CHANGED" ]; then
            echo "Mobile-relevant changes since $BASE:"
            echo "$MOBILE_CHANGED" | sed 's/^/  /'
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Nothing mobile-relevant since $BASE — skipping the build."
          echo "releases/latest keeps serving the APK built for $BASE."
          echo "should_build=false" >> "$GITHUB_OUTPUT"

  # D99: the bump lives in its own job so mobile-build (APK) and
  # mobile-play-release (AAB) can both depend on just this and run in
  # parallel, instead of paying for two ~10min native builds back to back.
  mobile-version-bump:
    needs: mobile-changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.mobile-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 for bumpMobileVersion.ts's tag/log walk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # D44: conventional-commit semver bump baselined against the last
      # `mobile-v*` tag, pushed straight to main with `[skip ci]` and a
      # bounded rebase-retry against a concurrent push.
      - name: Compute and push mobile version bump
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            npx tsx scripts/bumpMobileVersion.ts
            if git diff --quiet; then
              echo "No version bump needed."
              break
            fi
            VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
            git add apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle apps/mobile/android/app/src/main/res/values/strings.xml
            git commit -m "chore(mobile): bump version to $VERSION [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed version bump to $VERSION."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push mobile version bump to main after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — main moved concurrently, rebasing and retrying..."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done

  # D100: no `needs: deploy-production` — the API URL comes from
  # PRODUCTION_API_URL, so this overlaps the deploy/e2e chain instead of
  # queueing behind it. mobile-changes already asserted the variable is set.
  mobile-build:
    needs: [mobile-changes, mobile-version-bump]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.mobile-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/mobile-build.yml
    permissions:
      contents: write
    with:
      api_url: ${{ vars.PRODUCTION_API_URL }}
      skip_version_bump: true
    secrets: inherit

  # D98: the Play AAB build+submit runs automatically, on the same
  # should_build gate as mobile-build (D53). D99: in parallel with it — the
  # bumped versionCode comes from `ref: main`, not from the APK build. The
  # Play submission no-ops until PlayServiceAccountKey (D71) exists.
  mobile-play-release:
    needs: [mobile-changes, mobile-version-bump]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.mobile-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/mobile-release.yml
    permissions:
      contents: read
    with:
      api_url: ${{ vars.PRODUCTION_API_URL }}
    secrets: inherit

  # D109: needs only deploy-production, so it runs in parallel with the whole
  # mobile chain instead of waiting on mobile-build's outcome.
  deploy-site:
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      pages: write
      id-token: write
      contents: read
    secrets: inherit

  # Prunes the APK-carrying prereleases, keeping the 3 most recent. Plain
  # `needs:` on purpose (no `!cancelled()` escape): a skipped or failed
  # mobile-build means no new release, so there's nothing to prune.
  release-cleanup:
    needs: mobile-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/release-cleanup.yml
    permissions:
      contents: write
    secrets: inherit
