name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# D51 retired the `setup` job that used to install once and hand every check
# job a tarred `node_modules` artifact. `actions/setup-node`'s pnpm store cache
# makes `pnpm install --frozen-lockfile` a ~10s step in each job, which is
# cheaper than the ~12s the artifact download+extract cost — so the shared
# install bought nothing and its own job sat on the critical path for ~70s.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No AWS credentials are configured in this job — sst.config.ts/infra
      # typecheck against generated .sst/platform types, which only exist
      # after a local `sst dev`/`deploy`, so that step skips cleanly here.
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails the PR on a removed field/narrowed type/removed enum value in
      # packages/shared's zod contracts (DESIGN §2 D34) — additive changes
      # (new optional field, new enum value) pass silently.
      - name: Check schema snapshot
        run: pnpm --filter @techtok/shared run schema:check

  # From here down (D38, extended by D39): this is the release pipeline for a
  # merge to main — dev deploy -> e2e against dev -> production deploy ->
  # mobile build -> {site deploy, release cleanup} (the last two run in
  # parallel; neither depends on the other). Each stage gates the next so a
  # broken dev deploy or a failing e2e suite blocks production, and
  # production never redeploys again just to hand the mobile build a URL (it
  # reads the same deploy's own output instead). Each stage's actual steps
  # live in their own workflow file (deploy-dev.yml / e2e.yml /
  # deploy-production.yml / mobile-build.yml / deploy-site.yml /
  # release-cleanup.yml) and are pulled in here as reusable workflows, so each
  # can also be run standalone via workflow_dispatch.
  # A reusable workflow's own jobs can only ever be granted permissions the
  # calling job itself was granted (permissions narrow down the call chain,
  # never widen) — so each caller job below must re-declare whatever its
  # nested workflow's jobs request, or GitHub silently caps it to none.
  deploy-dev:
    needs: [lint, typecheck, test, schema-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-dev.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  e2e:
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  deploy-production:
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  # D53: decides whether this merge needs a new APK at all. The Android build
  # is ~60% of this pipeline's wall-clock and most merges to main are
  # backend-only, so rebuilding an identical APK every time is the single
  # biggest waste here. The baseline is the newest `mobile-v*` tag — the marker
  # D42's tagging step pushes after every successful APK release — so the
  # question asked is "has anything mobile-relevant landed since the APK that
  # releases/latest currently serves", not "did this one merge touch mobile".
  # That accumulates correctly across skipped runs: three backend merges then
  # one mobile merge still produces exactly one build, containing all four.
  mobile-changes:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      # fetch-depth: 0 for the tags and the commit range below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -euo pipefail
          # Same ordering scripts/bumpMobileVersion.ts uses to pick its own
          # baseline. for-each-ref --count=1 rather than `git tag | head -1`:
          # under `pipefail` the latter can fail the step outright when head
          # exits first and git takes SIGPIPE.
          BASE=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/mobile-v*')
          if [ -z "$BASE" ]; then
            echo "No mobile-v* tag exists yet — building (fail open)."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # packages/shared ships inside the app; pnpm-lock.yaml covers a
          # dependency bump that changes the bundle without touching app code.
          CHANGED=$(git diff --name-only "$BASE"..HEAD -- \
            apps/mobile \
            packages/shared \
            pnpm-lock.yaml \
            .github/workflows/mobile-build.yml)
          if [ -n "$CHANGED" ]; then
            echo "Mobile-relevant changes since $BASE:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing mobile-relevant since $BASE — skipping the APK build."
            echo "releases/latest keeps serving the APK built for $BASE."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  mobile-build:
    needs: [deploy-production, mobile-changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.mobile-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/mobile-build.yml
    permissions:
      contents: write
    with:
      api_url: ${{ needs.deploy-production.outputs.api_url }}
    secrets: inherit

  # Must still publish when mobile-build was skipped, so it can't just `needs`
  # it — a skipped dependency skips the dependent job unless a status-check
  # function (here `!cancelled()`) overrides that default. deploy-production is
  # added to `needs` so its success can be asserted explicitly, since
  # `!cancelled()` would otherwise let this run after an upstream failure.
  deploy-site:
    needs: [deploy-production, mobile-build]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.deploy-production.result == 'success'
      && (needs.mobile-build.result == 'success' || needs.mobile-build.result == 'skipped')
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      pages: write
      id-token: write
      contents: read
    secrets: inherit

  # Prunes the APK-carrying prereleases mobile-build just added to, keeping the
  # 3 most recent. Runs last so a fresh build is always among those kept; if
  # mobile-build failed there's no new release, so skipping cleanup is correct.
  # Deliberately keeps a plain `needs:` (no `!cancelled()` escape like
  # deploy-site's): when mobile-build is skipped by D53's gate there's likewise
  # no new release, so cascading the skip to here is the behaviour we want.
  release-cleanup:
    needs: mobile-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/release-cleanup.yml
    permissions:
      contents: write
    secrets: inherit
