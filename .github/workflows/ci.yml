name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace's node_modules (root + each package/app) is archived as
      # one artifact so lint/typecheck/test/schema-check can restore the exact
      # same install instead of each re-running `pnpm install`. Symlinks pnpm
      # creates inside each package's node_modules are relative, so they stay
      # valid once re-extracted at the same repo path in a downstream job.
      - name: Archive node_modules
        run: tar -czf node_modules.tar.gz $(find . -maxdepth 3 -type d -name node_modules)

      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules.tar.gz
          retention-days: 1

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - name: Restore node_modules
        run: tar -xzf node_modules.tar.gz
      - name: Lint
        run: pnpm lint

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - name: Restore node_modules
        run: tar -xzf node_modules.tar.gz
      # No AWS credentials are configured in this job — sst.config.ts/infra
      # typecheck against generated .sst/platform types, which only exist
      # after a local `sst dev`/`deploy`, so that step skips cleanly here.
      - name: Typecheck
        run: pnpm typecheck

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - name: Restore node_modules
        run: tar -xzf node_modules.tar.gz
      - name: Test
        run: pnpm test

  schema-check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - name: Restore node_modules
        run: tar -xzf node_modules.tar.gz
      # Fails the PR on a removed field/narrowed type/removed enum value in
      # packages/shared's zod contracts (DESIGN §2 D34) — additive changes
      # (new optional field, new enum value) pass silently.
      - name: Check schema snapshot
        run: pnpm --filter @techtok/shared run schema:check

  # From here down (D38, extended by D39): this is the release pipeline for a
  # merge to main — dev deploy -> e2e against dev -> production deploy ->
  # mobile build -> {site deploy, release cleanup} (the last two run in
  # parallel; neither depends on the other). Each stage gates the next so a
  # broken dev deploy or a failing e2e suite blocks production, and
  # production never redeploys again just to hand the mobile build a URL (it
  # reads the same deploy's own output instead). Each stage's actual steps
  # live in their own workflow file (deploy-dev.yml / e2e.yml /
  # deploy-production.yml / mobile-build.yml / deploy-site.yml /
  # release-cleanup.yml) and are pulled in here as reusable workflows, so each
  # can also be run standalone via workflow_dispatch.
  # A reusable workflow's own jobs can only ever be granted permissions the
  # calling job itself was granted (permissions narrow down the call chain,
  # never widen) — so each caller job below must re-declare whatever its
  # nested workflow's jobs request, or GitHub silently caps it to none.
  #
  # D52: deploy-dev deliberately has NO `needs` — it races the quality jobs
  # instead of queueing behind them, taking itself and e2e off the far side of
  # the check fan-out. `dev` is a throwaway stage, so deploying a commit that
  # turns out to fail lint costs nothing that the next merge doesn't fix.
  # deploy-production is what re-imposes the gate: it needs e2e AND all four
  # checks, so nothing reaches production that hasn't passed everything.
  deploy-dev:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-dev.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  e2e:
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  deploy-production:
    needs: [e2e, lint, typecheck, test, schema-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  mobile-build:
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/mobile-build.yml
    permissions:
      contents: write
    with:
      api_url: ${{ needs.deploy-production.outputs.api_url }}
    secrets: inherit

  deploy-site:
    needs: mobile-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      pages: write
      id-token: write
      contents: read
    secrets: inherit

  # Prunes the APK-carrying prereleases mobile-build just added to, keeping the
  # 3 most recent. Runs last so a fresh build is always among those kept; if
  # mobile-build failed there's no new release, so skipping cleanup is correct.
  release-cleanup:
    needs: mobile-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/release-cleanup.yml
    permissions:
      contents: write
    secrets: inherit
