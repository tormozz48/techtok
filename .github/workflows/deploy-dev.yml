name: Deploy dev

# ci.yml runs this first on main, then e2e against the freshly-deployed dev
# stage. workflow_dispatch for an ad hoc redeploy.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # techtok-gha-dev-deploy: least-privilege, scoped to techtok-dev-* only,
      # so a compromised dev credential can't touch production.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clear a stale state lock left by an interrupted run.
      - name: Unlock SST state
        run: npx sst unlock --stage dev

      # D92: migrations run here, not by hand — a forgotten `pnpm db:migrate`
      # left dev on a stale constraint once (D49). Needs a *direct*
      # connection: drizzle-kit's DDL can't run over the pooled runtime secret.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL_DEV_DIRECT repository secret is not set — see README.md's Required repository secrets table (D92)."
            exit 1
          fi
          pnpm db:migrate

      # GOOGLE_OAUTH_WEB_CLIENT_ID (D68) is the JWT authorizer's audience —
      # public by design, but without it every real ID token is rejected.
      - name: Deploy dev
        env:
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
        run: npx sst deploy --stage dev

      # D95: a destructive migration leaves zero sources and nothing else
      # re-seeds them — LoadSources only lists what's already there, so the
      # feed never refills. Idempotent, so unconditional is a no-op.
      - name: Seed source presets
        run: |
          FN=$(node -e "console.log(require('./.sst/outputs.json').seedSources)")
          ERR=$(aws lambda invoke --function-name "$FN" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            --query 'FunctionError' --output text /tmp/seedSources.json)
          cat /tmp/seedSources.json
          if [ "$ERR" != "None" ]; then
            echo "::error::SeedSources returned $ERR — this stage may have no sources."
            exit 1
          fi
