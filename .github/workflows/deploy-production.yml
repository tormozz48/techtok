name: Deploy production

# Called by ci.yml as step 4 of the main-branch release pipeline (D38), after
# e2e passes against dev. workflow_dispatch is kept for an ad hoc manual
# redeploy — don't run this from a laptop otherwise (production deploys only
# happen through CI, per CLAUDE.md).
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      api_url:
        description: The real production API Gateway URL, read from this deploy's own .sst/outputs.json.
        value: ${{ jobs.deploy.outputs.api_url }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clears any stale SST state lock left by an interrupted prior run
      # before every deploy, so a hung lock can't block this pipeline.
      - name: Unlock SST state
        run: npx sst unlock --stage production

      # D92: same rationale as deploy-dev.yml's identical step — migrations
      # apply automatically before production Lambda code that assumes the
      # new schema goes live, over the direct (non-pooled) connection
      # drizzle-kit needs rather than the pooled NeonDatabaseUrl runtime
      # secret.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_PRODUCTION_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL_PRODUCTION_DIRECT repository secret is not set — see README.md's Required repository secrets table (D92)."
            exit 1
          fi
          pnpm db:migrate

      # `sst deploy` writes the stack's stage outputs (defined in
      # sst.config.ts's `run()` return value, including the real API Gateway
      # URL as `api`) to .sst/outputs.json. Since D100 the mobile builds read
      # that URL from the PRODUCTION_API_URL repository variable instead of
      # from this output, so they no longer wait on this job — the output
      # stays as this workflow's answer to "what is the URL", and as the
      # input to the drift check below.
      # GOOGLE_OAUTH_WEB_CLIENT_ID (D68): see deploy-dev.yml's identical note.
      - name: Deploy production
        id: deploy
        env:
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
        run: |
          npx sst deploy --stage production
          echo "api_url=$(node -e "console.log(require('./.sst/outputs.json').api)")" >> "$GITHUB_OUTPUT"

      # D100 traded a pipeline dependency for a hand-maintained repository
      # variable, so this is the one place that can tell it has gone stale:
      # the mobile builds bake PRODUCTION_API_URL into every APK/AAB and have
      # no way to know it no longer matches the deployed API. A warning rather
      # than a failure — the deploy itself succeeded and nothing about it is
      # wrong; what needs fixing is a variable someone has to go and update.
      - name: Check PRODUCTION_API_URL matches the deployed API
        run: |
          DEPLOYED='${{ steps.deploy.outputs.api_url }}'
          CONFIGURED='${{ vars.PRODUCTION_API_URL }}'
          if [ -z "$CONFIGURED" ]; then
            echo "::warning::The PRODUCTION_API_URL repository variable is not set. Set it to $DEPLOYED — every mobile build reads it (D100)."
          elif [ "$CONFIGURED" != "$DEPLOYED" ]; then
            echo "::warning::The PRODUCTION_API_URL repository variable ($CONFIGURED) does not match this deploy's API URL ($DEPLOYED). Mobile builds are baking in the stale one (D100)."
          else
            echo "PRODUCTION_API_URL matches the deployed API."
          fi

      # A destructive migration (D94's 0003 dropped every table) leaves the
      # stage with zero sources, and nothing else re-seeds them: LoadSources
      # only lists what is already there, so the ingest pipeline maps over an
      # empty set and the feed never refills. SeedSources is idempotent
      # (putIfNew over the stage's presets), so running it on every deploy is
      # a no-op once seeded — the same argument D92 makes for db:migrate.
      - name: Seed source presets
        run: |
          FN=$(node -e "console.log(require('./.sst/outputs.json').seedSources)")
          ERR=$(aws lambda invoke --function-name "$FN" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            --query 'FunctionError' --output text /tmp/seedSources.json)
          cat /tmp/seedSources.json
          if [ "$ERR" != "None" ]; then
            echo "::error::SeedSources returned $ERR — this stage may have no sources."
            exit 1
          fi
