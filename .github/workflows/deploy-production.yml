name: Deploy production

# Called by ci.yml as step 4 of the main-branch release pipeline (D38), after
# e2e passes against dev. workflow_dispatch is kept for an ad hoc manual
# redeploy — don't run this from a laptop otherwise (production deploys only
# happen through CI, per CLAUDE.md).
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      api_url:
        description: The real production API Gateway URL, read from this deploy's own .sst/outputs.json.
        value: ${{ jobs.deploy.outputs.api_url }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clears any stale SST state lock left by an interrupted prior run
      # before every deploy, so a hung lock can't block this pipeline.
      - name: Unlock SST state
        run: npx sst unlock --stage production

      # `sst deploy` writes the stack's stage outputs (defined in
      # sst.config.ts's `run()` return value, including the real API Gateway
      # URL as `api`) to .sst/outputs.json. Reading it here is how the
      # mobile-build workflow gets the real production URL without it ever
      # being committed to apps/mobile/eas.json.
      - name: Deploy production
        id: deploy
        run: |
          npx sst deploy --stage production
          echo "api_url=$(node -e "console.log(require('./.sst/outputs.json').api)")" >> "$GITHUB_OUTPUT"
