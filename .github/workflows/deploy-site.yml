name: Deploy site

# Runs after mobile-build has published this run's APK to a non-prerelease
# Release (D39), so the site's releases/latest download link and QR resolve
# correctly the moment it goes live. workflow_dispatch for a copy-only redeploy.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main — the version bump was pushed there mid-run (D44), so the
      # default trigger SHA would build the badge one release behind.
      # fetch-depth: 0 (D60) — the release feed reads mobile-v* tags locally.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # enablement: true turns Pages on if it was never enabled in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site
        run: pnpm --filter site run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
