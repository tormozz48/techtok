name: Deploy to AWS

# The only deploy in this repo (D100 removed the CI `dev` deploy). Called by
# ci.yml after the six checks; e2e then runs against what this deployed.
# workflow_dispatch is for an ad hoc redeploy — never deploy from a laptop.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      api_url:
        description: The real production API Gateway URL, read from this deploy's own .sst/outputs.json.
        value: ${{ jobs.deploy.outputs.api_url }}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy mid-run

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clear a stale state lock left by an interrupted run.
      - name: Unlock SST state
        run: npx sst unlock --stage production

      # D92: migrations run before the Lambda code that assumes them, over
      # the direct (non-pooled) connection drizzle-kit needs — not the pooled
      # NeonDatabaseUrl runtime secret.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_PRODUCTION_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL_PRODUCTION_DIRECT repository secret is not set — see README.md's Required repository secrets table (D92)."
            exit 1
          fi
          pnpm db:migrate

      # `sst deploy` writes the stage outputs (including the API URL as
      # `api`) to .sst/outputs.json. Since D100 the mobile builds read
      # PRODUCTION_API_URL instead; this output feeds the drift check below.
      # GOOGLE_OAUTH_WEB_CLIENT_ID (D68) is the JWT authorizer's audience —
      # public by design, but without it every real ID token is rejected.
      - name: Deploy production
        id: deploy
        env:
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
        run: |
          npx sst deploy --stage production
          echo "api_url=$(node -e "console.log(require('./.sst/outputs.json').api)")" >> "$GITHUB_OUTPUT"

      # D100 traded a pipeline dependency for a hand-maintained variable, so
      # this is the only place that can tell it has gone stale. A warning, not
      # a failure — the deploy is fine, the variable is what needs updating.
      - name: Check PRODUCTION_API_URL matches the deployed API
        run: |
          DEPLOYED='${{ steps.deploy.outputs.api_url }}'
          CONFIGURED='${{ vars.PRODUCTION_API_URL }}'
          if [ -z "$CONFIGURED" ]; then
            echo "::warning::The PRODUCTION_API_URL repository variable is not set. Set it to $DEPLOYED — every mobile build reads it (D100)."
          elif [ "$CONFIGURED" != "$DEPLOYED" ]; then
            echo "::warning::The PRODUCTION_API_URL repository variable ($CONFIGURED) does not match this deploy's API URL ($DEPLOYED). Mobile builds are baking in the stale one (D100)."
          else
            echo "PRODUCTION_API_URL matches the deployed API."
          fi

      # D95: a destructive migration leaves zero sources and nothing else
      # re-seeds them — LoadSources only lists what's already there, so the
      # feed never refills. Idempotent, so unconditional is a no-op.
      - name: Seed source presets
        run: |
          FN=$(node -e "console.log(require('./.sst/outputs.json').seedSources)")
          ERR=$(aws lambda invoke --function-name "$FN" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            --query 'FunctionError' --output text /tmp/seedSources.json)
          cat /tmp/seedSources.json
          if [ "$ERR" != "None" ]; then
            echo "::error::SeedSources returned $ERR — this stage may have no sources."
            exit 1
          fi
