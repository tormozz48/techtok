name: E2E (dev stage)

# D34: the one non-deploy workflow allowed real AWS credentials — dev-stage
# read/invoke only, via techtok-gha-e2e. Never triggered by push/pull_request;
# ci.yml calls it on main only, between the dev and production deploys, so
# PR-triggered jobs stay credential-free.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: e2e-dev
  cancel-in-progress: false

jobs:
  backend-pipeline:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Starts a real IngestPipeline execution against dev and asserts the
      # Postgres/SQS transitions it should cause. D97: fail loudly without
      # DATABASE_URL rather than let describe.skipIf make this a silent no-op.
      # Dev's connection string only -- production's is never exposed here.
      - name: Run backend pipeline E2E
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL_DEV_DIRECT repository secret is not set -- the backend pipeline E2E would silently skip (D97)."
            exit 1
          fi
          pnpm --filter @techtok/e2e run backend-pipeline

  api-contract:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Calls the deployed dev API and parses every response through the same
      # packages/shared zod schemas the app uses. D68: all but the two public
      # catalogs need a verified Google ID token, minted for a dedicated test
      # account (packages/e2e/src/googleTestAuth.ts). Those suites skip
      # cleanly until the three secrets exist.
      - name: Run API contract E2E
        env:
          GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
        run: pnpm --filter @techtok/e2e run api-contract

  # The Maestro emulator job lives in mobile-emulator-e2e.yml — manual
  # dispatch only, so UI flake can't block this schedule or the pipeline.
