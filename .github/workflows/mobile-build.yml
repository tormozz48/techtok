name: Mobile build

# Called by ci.yml as step 5 of the main-branch release pipeline (D38), after
# a production deploy, receiving that deploy's real API URL as an input.
# workflow_dispatch is kept for an ad hoc manual rebuild — pass the current
# production API URL by hand (find it via the deploy-production workflow's
# most recent run output, or `npx sst deploy --stage production` locally).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API URL to bake into the build (EXPO_PUBLIC_API_URL)
        required: true
        type: string
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string

concurrency:
  group: mobile-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release that hosts the APK
    steps:
      # fetch-depth: 0 is needed for the version-bump step's `git tag --list`/
      # `git log <tag>..HEAD` walk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # RN 0.86 / Android Gradle Plugin require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK/NDK; this pins cmdline-tools and
      # accepts licenses so Gradle can fetch any missing package for the build.
      - uses: android-actions/setup-android@v3

      # Installs eas-cli and authenticates via EXPO_TOKEN (a free Expo account).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # D44 (amends D41/D42/D43): computes a conventional-commit-driven
      # semver bump (baselined against the last `mobile-v*` tag) and pushes it
      # directly to `main` — reinstating D40's original post-merge mechanism
      # now that the `ProtectMainBrach` ruleset's `pull_request` requirement
      # has been removed, so a direct push is no longer categorically blocked.
      # Two mitigations D40 lacked: (1) the commit message carries
      # `[skip ci]`, so the push doesn't retrigger `ci.yml` and cancel this
      # very run via its own `cancel-in-progress` concurrency group; (2) a
      # bounded rebase-and-retry loop against a genuinely concurrent push to
      # `main`, instead of failing outright on the first non-fast-forward
      # rejection (D41's original failure mode). D43's PR-branch auto-bump
      # workflow is retired — this is the only automated bump path now.
      - name: Compute and push mobile version bump
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            npx tsx scripts/bumpMobileVersion.ts
            if git diff --quiet; then
              echo "No version bump needed."
              break
            fi
            VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
            git add apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle
            git commit -m "chore(mobile): bump version to $VERSION [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed version bump to $VERSION."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push mobile version bump to main after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — main moved concurrently, rebasing and retrying..."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done

      # D58: generates feature/fix release notes from conventional commits
      # since the last mobile-v* tag (the same commit range and feat:/fix:
      # classification bumpMobileVersion.ts uses to pick the version bump),
      # so the GitHub Release body and the release tag's annotation describe
      # what actually shipped instead of static boilerplate. Runs after the
      # version-bump step (whose commit, if any, is itself a chore: and so
      # never appears in the changelog) and before the tag is created, so
      # "last mobile-v* tag" here still means the previous release.
      - name: Generate release notes
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          PREV_TAG=$(git tag --list 'mobile-v*' --sort=-v:refname | head -n1)
          RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          fi

          FEATURES=$(git log "$RANGE" --format='%s' | grep -E '^feat(\([^)]*\))?!?:' | sed -E 's/^feat(\([^)]*\))?!?:[[:space:]]*/- /' || true)
          FIXES=$(git log "$RANGE" --format='%s' | grep -E '^fix(\([^)]*\))?!?:' | sed -E 's/^fix(\([^)]*\))?!?:[[:space:]]*/- /' || true)

          {
            echo "## What's changed"
            if [ -n "$FEATURES" ]; then
              echo ""
              echo "### Features"
              echo "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "### Fixes"
              echo "$FIXES"
            fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
              echo ""
              echo "_No user-facing feat/fix commits since the last release._"
            fi
          } > changelog.md

          {
            cat changelog.md
            echo ""
            echo "---"
            echo ""
            echo 'Automated internal APK — built with `eas build --local` (unmetered; does not use an EAS cloud-build credit).'
            echo ""
            echo "- Commit: $COMMIT_SHA"
            echo '- Install: download `techtok.apk` on an Android phone, then allow "install from unknown sources" for this file.'
            echo "- Always-current link: https://github.com/tormozz48/techtok/releases/latest/download/techtok.apk (also on the [project site](https://tormozz48.github.io/techtok/))."
          } > release-body.md

      # Reuse the Gradle distribution + Maven deps + build-cache across runs.
      # `eas build --local` runs Gradle from the home GRADLE_USER_HOME (~/.gradle),
      # so caching that here skips the big first-time downloads and recompiles.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # `--local` runs the build on this runner, so it does NOT consume an EAS
      # cloud-build credit (free tier = 15/mo) — effectively unlimited. Signing
      # credentials are pulled from EAS (credentialsSource defaults to "remote")
      # using EXPO_TOKEN, so no keystore is stored in GitHub. EXPO_PUBLIC_API_URL
      # comes from this workflow's own `api_url` input (the caller passes the
      # production deploy's real URL) — it never lives in eas.json or anywhere
      # else in source control.
      - name: Build Android APK (eas build --local)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: eas build --platform android --profile preview --local --non-interactive --output "${{ github.workspace }}/techtok.apk"

      # D60: publishes this build's JS/asset bundle to the "preview" EAS
      # Update channel — the same channel eas.json's `preview` profile (used
      # just above) embeds into the APK — so an already-installed build picks
      # it up automatically on next launch (AndroidManifest's
      # EXPO_UPDATES_CHECK_ON_LAUNCH=ALWAYS) instead of a friend needing to
      # reinstall. Gated on the build step above succeeding, since a failed
      # native compile means we don't have confidence this commit's native
      # side is sound. runtimeVersion is a hand-maintained string (D18's
      # committed `android/` project has no per-build prebuild step, so a
      # fingerprint policy would never actually be recomputed by CI — see
      # D60) — publishing here is only safe for the current runtimeVersion.
      # Any native-affecting change (new native dependency, app.json
      # plugin/permission/icon change, Expo SDK bump) MUST bump
      # runtimeVersion in both app.json and this generated
      # strings.xml/expo_runtime_version by hand first, or this step would
      # silently offer an incompatible JS bundle to already-installed apps.
      - name: Publish OTA update (eas update)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          eas update --channel preview --platform android --non-interactive --message "v$VERSION"

      # prerelease: false (D39, amends this decision) — GitHub's
      # releases/latest alias only ever resolves to the newest *non*-prerelease
      # release, and the project site's download button + QR code both point
      # at that stable releases/latest/download/techtok.apk URL.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: TechTok Android build ${{ github.run_number }}
          prerelease: false
          files: ${{ github.workspace }}/techtok.apk
          body_path: ${{ github.workspace }}/release-body.md

      # Tag-only reinstatement of release marking (D42, amends D41). Reads the
      # version off `app.json` as left on disk by the bump step above (D44),
      # which already committed and pushed it to `main` if it changed. Now an
      # annotated tag (D58) carrying the feat/fix changelog from the release
      # notes step above as its message, instead of a bare lightweight tag.
      - name: Tag release version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
          TAG="mobile-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin (version wasn't bumped since the last release) — skipping."
            exit 0
          fi
          # --cleanup=verbatim: git's default tag-message cleanup ("strip")
          # treats any line starting with `#` as a comment and drops it —
          # including changelog.md's own "## What's changed"/"### Features"/
          # "### Fixes" Markdown headers — and collapses blank lines, so
          # without this flag every tag message silently degraded to a flat,
          # unsectioned bullet list (D58 amendment). release-body.md above
          # doesn't hit this: `body_path` ships those same bytes verbatim
          # through the GitHub API, never through git's message cleanup.
          git tag -a "$TAG" --cleanup=verbatim -F changelog.md
          git push origin "refs/tags/$TAG"
