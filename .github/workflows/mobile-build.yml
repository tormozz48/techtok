name: Mobile build

# Builds the APK. Called by ci.yml in parallel with the deploy/e2e chain
# (D100), which passes the PRODUCTION_API_URL repository variable as
# `api_url`. workflow_dispatch takes that URL by hand — find it in the
# Deploy production workflow's most recent run output.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API URL to bake into the build (EXPO_PUBLIC_API_URL)
        required: true
        type: string
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
      # D99: ci.yml's mobile-version-bump job already pushed the bump, so the
      # step below would be a no-op. A standalone dispatch never sets this.
      skip_version_bump:
        required: false
        type: boolean
        default: false

concurrency:
  group: mobile-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release that hosts the APK
    steps:
      # fetch-depth: 0 for the version-bump/release-notes tag walk. ref: main
      # (D99) so this sees the bump commit mobile-version-bump just pushed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # RN 0.86 / Android Gradle Plugin require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pins cmdline-tools and accepts licenses. packages: 'platform-tools'
      # overrides the default — the legacy 'tools' package drags in the
      # emulator, useless for a headless APK build.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Installs eas-cli and authenticates via EXPO_TOKEN (a free Expo account).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # D44: conventional-commit semver bump baselined against the last
      # `mobile-v*` tag, pushed straight to main. `[skip ci]` stops it
      # retriggering ci.yml and cancelling this run; the rebase-retry loop
      # handles a concurrent push. Skipped when ci.yml already bumped (D99).
      - name: Compute and push mobile version bump
        if: inputs.skip_version_bump != true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            npx tsx scripts/bumpMobileVersion.ts
            if git diff --quiet; then
              echo "No version bump needed."
              break
            fi
            VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
            git add apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle apps/mobile/android/app/src/main/res/values/strings.xml
            git commit -m "chore(mobile): bump version to $VERSION [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed version bump to $VERSION."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push mobile version bump to main after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — main moved concurrently, rebasing and retrying..."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done

      # D58: release notes from conventional commits since the last mobile-v*
      # tag — same range and classification bumpMobileVersion.ts uses. Runs
      # before the tag is created, so that range still means "previous release".
      - name: Generate release notes
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          PREV_TAG=$(git tag --list 'mobile-v*' --sort=-v:refname | head -n1)
          RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          fi

          FEATURES=$(git log "$RANGE" --format='%s' | grep -E '^feat(\([^)]*\))?!?:' | sed -E 's/^feat(\([^)]*\))?!?:[[:space:]]*/- /' || true)
          FIXES=$(git log "$RANGE" --format='%s' | grep -E '^fix(\([^)]*\))?!?:' | sed -E 's/^fix(\([^)]*\))?!?:[[:space:]]*/- /' || true)

          {
            echo "## What's changed"
            if [ -n "$FEATURES" ]; then
              echo ""
              echo "### Features"
              echo "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "### Fixes"
              echo "$FIXES"
            fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
              echo ""
              echo "_No user-facing feat/fix commits since the last release._"
            fi
          } > changelog.md

          {
            cat changelog.md
            echo ""
            echo "---"
            echo ""
            echo 'Automated internal APK — built with `eas build --local` (unmetered; does not use an EAS cloud-build credit).'
            echo ""
            echo "- Commit: $COMMIT_SHA"
            echo '- Install: download `techtok.apk` on an Android phone, then allow "install from unknown sources" for this file.'
            echo "- Always-current link: https://github.com/tormozz48/techtok/releases/latest/download/techtok.apk (also on the [project site](https://tormozz48.github.io/techtok/))."
          } > release-body.md

      # Caches ~/.gradle (where `eas build --local` runs Gradle from).
      # app/build.gradle is excluded from the hash on purpose: the version
      # bump rewrites it every release, which busted the key on every run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/build.gradle', 'apps/mobile/android/settings.gradle', 'apps/mobile/android/gradle.properties', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # `--local` builds on this runner, consuming no EAS cloud-build credit.
      # Signing credentials come from EAS via EXPO_TOKEN — no keystore in
      # GitHub. EXPO_PUBLIC_API_URL comes from this workflow's input, so it
      # never lives in eas.json. EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID (D68) is
      # public by design but required, or Sign-In fails in every shipped APK.
      # SENTRY_AUTH_TOKEN is optional — without it the upload is just skipped.
      # EAS_LOCAL_BUILD_WORKINGDIR pins a stable path: Gradle keys several
      # task types off absolute input paths, so eas-cli's default random tmp
      # dir made the restored cache miss for most tasks (~28% hit rate).
      - name: Build Android APK (eas build --local)
        working-directory: apps/mobile
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: /home/runner/eas-local-build
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          SENTRY_ORG: tormozz48
          SENTRY_PROJECT: react-native
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: eas build --platform android --profile preview --local --non-interactive --output "${{ github.workspace }}/techtok.apk"

      # D60: publishes this build's bundle to the `preview` channel the APK
      # embeds, so installed builds update on next launch instead of needing a
      # reinstall. runtimeVersion is hand-maintained (D18's committed android/
      # has no per-build prebuild), so D87 made the version-bump step above
      # bump it unconditionally — this job only runs on native changes anyway.
      - name: Publish OTA update (eas update)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          eas update --channel preview --platform android --non-interactive --message "v$VERSION"

      # prerelease: false (D39) — releases/latest only resolves to a
      # non-prerelease, and the site's download button + QR point at it.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: TechTok Android build ${{ github.run_number }}
          prerelease: false
          files: ${{ github.workspace }}/techtok.apk
          body_path: ${{ github.workspace }}/release-body.md

      # D42: tags the release, reading the version off app.json as the bump
      # step left it. Annotated (D58), carrying the changelog as its message.
      - name: Tag release version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
          TAG="mobile-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin (version wasn't bumped since the last release) — skipping."
            exit 0
          fi
          # --cleanup=verbatim: git's default strips any `#` line as a
          # comment, which would eat changelog.md's own Markdown headers.
          git tag -a "$TAG" --cleanup=verbatim -F changelog.md
          git push origin "refs/tags/$TAG"
