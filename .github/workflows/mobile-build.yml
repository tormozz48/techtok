name: Mobile build

# Called by ci.yml as step 5 of the main-branch release pipeline (D38), after
# a production deploy, receiving that deploy's real API URL as an input.
# workflow_dispatch is kept for an ad hoc manual rebuild — pass the current
# production API URL by hand (find it via the deploy-production workflow's
# most recent run output, or `npx sst deploy --stage production` locally).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API URL to bake into the build (EXPO_PUBLIC_API_URL)
        required: true
        type: string
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string

concurrency:
  group: mobile-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release that hosts the APK
    steps:
      # fetch-depth: 0 is needed for the version-bump step's `git tag --list`/
      # `git log <tag>..HEAD` walk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # RN 0.86 / Android Gradle Plugin require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK/NDK; this pins cmdline-tools and
      # accepts licenses so Gradle can fetch any missing package for the build.
      # Load-bearing since D54 removed EAS from this job — nothing else here
      # would accept a license for a package Gradle decides it needs.
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # D44 (amends D41/D42/D43): computes a conventional-commit-driven
      # semver bump (baselined against the last `mobile-v*` tag) and pushes it
      # directly to `main` — reinstating D40's original post-merge mechanism
      # now that the `ProtectMainBrach` ruleset's `pull_request` requirement
      # has been removed, so a direct push is no longer categorically blocked.
      # Two mitigations D40 lacked: (1) the commit message carries
      # `[skip ci]`, so the push doesn't retrigger `ci.yml` and cancel this
      # very run via its own `cancel-in-progress` concurrency group; (2) a
      # bounded rebase-and-retry loop against a genuinely concurrent push to
      # `main`, instead of failing outright on the first non-fast-forward
      # rejection (D41's original failure mode). D43's PR-branch auto-bump
      # workflow is retired — this is the only automated bump path now.
      - name: Compute and push mobile version bump
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            npx tsx scripts/bumpMobileVersion.ts
            if git diff --quiet; then
              echo "No version bump needed."
              break
            fi
            VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
            git add apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle
            git commit -m "chore(mobile): bump version to $VERSION [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed version bump to $VERSION."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push mobile version bump to main after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — main moved concurrently, rebasing and retrying..."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done

      # Reuse the Gradle distribution + Maven deps + build-cache across runs.
      # Gradle runs from the home GRADLE_USER_HOME (~/.gradle), so caching that
      # here skips the big first-time downloads and recompiles.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # D54: signing moved off EAS-managed remote credentials onto four GitHub
      # secrets, because dropping `eas build --local` (below) also drops the
      # EXPO_TOKEN-authenticated credential fetch that used to sign the APK.
      #
      # This step MUST fail rather than continue when the secrets are missing.
      # app/build.gradle (D18) silently falls back to the debug key when
      # android/keystore.properties is absent, and that fallback is a trap
      # here: a debug-signed APK installs fine on a clean device but Android
      # refuses to update an installed app whose signature changed, so every
      # existing user would hit "App not installed" and have to uninstall
      # first, losing their local state. Publishing one to releases/latest
      # would be worse than not building at all.
      - name: Materialize release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release-signing secret(s):$missing — refusing to build."
            echo "Without them build.gradle would fall back to the debug key and produce"
            echo "an APK that cannot upgrade any existing install. Export the upload key"
            echo "from EAS (npx eas credentials --platform android) and add the four"
            echo "secrets; see docs/DISTRIBUTION.md."
            exit 1
          fi
          # storeFile is resolved by file() inside the :app module, so it is
          # relative to apps/mobile/android/app/. Both this and
          # keystore.properties are already covered by android/.gitignore.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/mobile/android/keystore.properties
          echo "Release keystore materialized ($(wc -c < apps/mobile/android/app/release.keystore) bytes)."

      # D54: plain Gradle instead of `eas build --local`. The android/ project
      # is committed (D18) and EAS was already skipping prebuild for it, so
      # everything EAS still did here was overhead — archiving the workspace
      # into its own sandbox, running a second full `pnpm install` there, and
      # `expo doctor` — about 2.5 min before Gradle even started. Both are
      # equally unmetered; neither consumes an EAS cloud-build credit.
      # EXPO_PUBLIC_API_URL comes from this workflow's own `api_url` input (the
      # caller passes the production deploy's real URL) and is read by Metro
      # during :app:bundleReleaseJsAndAssets — it never lives in source control.
      - name: Build Android APK (gradlew)
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: ./gradlew :app:assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK at $APK but it does not exist."
            find apps/mobile/android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" "${{ github.workspace }}/techtok.apk"

      # prerelease: false (D39, amends this decision) — GitHub's
      # releases/latest alias only ever resolves to the newest *non*-prerelease
      # release, and the project site's download button + QR code both point
      # at that stable releases/latest/download/techtok.apk URL.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: TechTok Android build ${{ github.run_number }}
          prerelease: false
          files: ${{ github.workspace }}/techtok.apk
          body: |
            Automated internal APK — built with `./gradlew :app:assembleRelease` on the GitHub runner (unmetered).

            - Commit: ${{ github.sha }}
            - Install: download `techtok.apk` on an Android phone, then allow "install from unknown sources" for this file.
            - Always-current link: https://github.com/tormozz48/techtok/releases/latest/download/techtok.apk (also on the [project site](https://tormozz48.github.io/techtok/)).

      # Tag-only reinstatement of release marking (D42, amends D41). Reads the
      # version off `app.json` as left on disk by the bump step above (D44),
      # which already committed and pushed it to `main` if it changed.
      - name: Tag release version
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
          TAG="mobile-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin (version wasn't bumped since the last release) — skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
