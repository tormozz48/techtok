name: Mobile build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release that hosts the APK
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # RN 0.86 / Android Gradle Plugin require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK/NDK; this pins cmdline-tools and
      # accepts licenses so Gradle can fetch any missing package for the build.
      - uses: android-actions/setup-android@v3

      # Installs eas-cli and authenticates via EXPO_TOKEN (a free Expo account).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--local` runs the build on this runner, so it does NOT consume an EAS
      # cloud-build credit (free tier = 15/mo) — effectively unlimited. Signing
      # credentials are pulled from EAS (credentialsSource defaults to "remote")
      # using EXPO_TOKEN, so no keystore is stored in GitHub.
      - name: Build Android APK (eas build --local)
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output "${{ github.workspace }}/techtok.apk"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: TechTok Android build ${{ github.run_number }}
          prerelease: true
          files: ${{ github.workspace }}/techtok.apk
          body: |
            Automated internal APK — built with `eas build --local` (unmetered; does not use an EAS cloud-build credit).

            - Commit: ${{ github.sha }}
            - Install: download `techtok.apk` on an Android phone, then allow "install from unknown sources" for this file.
