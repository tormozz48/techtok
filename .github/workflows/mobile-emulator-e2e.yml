name: Mobile emulator E2E

# Drives the actual mobile app (not just its API) on an Android emulator via
# Maestro (packages/e2e/maestro), using the same sign-in bypass build flag
# as a local run (apps/mobile/src/state/e2eAuth.ts).
#
# Split out of e2e.yml (previously the `mobile-emulator` job there) so this
# suite is fully out of the automatic e2e bundle: it no longer runs on
# e2e.yml's daily schedule and isn't reachable via ci.yml's release-pipeline
# `e2e` call at all. UI-level Maestro flows are inherently more flake-prone
# (cold boot, animation timing) than the HTTP-contract jobs in e2e.yml, and a
# flaky assertion here shouldn't be able to block anything — manual
# workflow_dispatch only, for now.
#
# Uses the same GOOGLE_TEST_REFRESH_TOKEN/GOOGLE_OAUTH_WEB_CLIENT_ID/
# GOOGLE_OAUTH_WEB_CLIENT_SECRET secrets as e2e.yml's api-contract job (no new
# secrets needed) — skips cleanly with a summary note, not a failure, until
# those are provisioned (see packages/e2e/src/googleTestAuth.ts).
on:
  workflow_dispatch:

concurrency:
  group: mobile-emulator-e2e
  cancel-in-progress: false

jobs:
  mobile-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Google test credentials are provisioned
        id: creds
        run: |
          if [ -z "${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}" ]; then
            echo "GOOGLE_TEST_REFRESH_TOKEN is not set — skipping the mobile emulator suite (see packages/e2e/src/googleTestAuth.ts)." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover dev API endpoint
        if: steps.creds.outputs.skip == 'false'
        id: api
        run: echo "url=$(pnpm exec tsx packages/e2e/scripts/discoverApiUrl.ts dev)" >> "$GITHUB_OUTPUT"

      - name: Mint a Google ID token for the E2E test account
        if: steps.creds.outputs.skip == 'false'
        env:
          GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
        run: |
          ID_TOKEN="$(pnpm exec tsx packages/e2e/scripts/mintIdToken.ts)"
          echo "::add-mask::$ID_TOKEN"
          echo "ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      # restore/save is deliberately split (not the combined actions/cache@v4)
      # for all three caches in this job: the combined action's save only
      # fires from a "post" cleanup hook that GitHub skips once ANY later
      # step in the job fails — confirmed the hard way, a run whose Maestro
      # step failed left "Post Cache E2E APK"/"Post Cache Gradle"/"Post Cache
      # AVD" all skipped, so nothing was ever actually cached despite every
      # run reporting a normal restore. The explicit `save` steps near the
      # end of this job carry `if: always()` so they persist the cache
      # regardless of what a later step (Maestro flows, most likely) does.
      #
      # Keyed on every input that changes what the APK contains: app source,
      # the native android/ project, the shared package (bundled into the JS),
      # the lockfile, and the API endpoint it's built pointing at. A cache hit
      # skips the build step entirely below.
      - name: Restore Gradle cache
        if: steps.creds.outputs.skip == 'false'
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore E2E APK cache
        if: steps.creds.outputs.skip == 'false'
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: mobile-e2e-apk-${{ hashFiles('apps/mobile/src/**', 'apps/mobile/android/**', 'packages/shared/src/**', 'pnpm-lock.yaml') }}-${{ steps.api.outputs.url }}

      - name: Build E2E APK
        if: steps.creds.outputs.skip == 'false' && steps.apk-cache.outputs.cache-hit != 'true'
        env:
          TECHTOK_E2E_API_URL: ${{ steps.api.outputs.url }}
          TECHTOK_E2E_ARCH: x86_64
        run: pnpm --filter @techtok/e2e run build-mobile-e2e-apk

      - name: Upload APK artifact
        if: steps.creds.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # https://github.com/ReactiveCircus/android-emulator-runner#usage — GitHub
      # Actions' ubuntu-latest runners support KVM, but /dev/kvm isn't
      # world-writable by default; this grants the runner user access.
      - name: Enable KVM
        if: steps.creds.outputs.skip == 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore AVD cache
        if: steps.creds.outputs.skip == 'false'
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Cache key includes the profile (bumped along with adding one
          # below) so a previously-cached small-default-profile AVD isn't
          # silently reused — force-avd-creation stays false, so without a
          # key bump the stale AVD would win over the new profile input.
          key: avd-34-google_apis-x86_64-pixel_6

      - name: Create AVD snapshot (cache miss only)
        if: steps.creds.outputs.skip == 'false' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A real device profile, not the action's tiny default (320x640,
          # confirmed via a real run's boot log) — the settings flow's
          # tapOn(settings-topic-ai) failed because that content was
          # genuinely off-screen and unreachable by Maestro's bounded
          # auto-scroll on a screen that small.
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      # Appending to $GITHUB_PATH (not a plain `export`) is what's needed here:
      # reactivecircus/android-emulator-runner's `script:` input runs each
      # line as its own separate shell invocation, so a PATH exported in one
      # line is gone by the next — this instead updates the whole job's PATH
      # for every later step (confirmed the hard way: an in-script `export`
      # here previously failed with "maestro: not found").
      - name: Install Maestro
        if: steps.creds.outputs.skip == 'false'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        if: steps.creds.outputs.skip == 'false'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test packages/e2e/maestro/flows -e APP_ID=com.tormozz48dev.techtok -e ID_TOKEN="$ID_TOKEN"

      # `if: always()` is the point of splitting these out — see the restore
      # steps' comment above. `cache-hit != 'true'` skips a redundant upload
      # when the restore already matched this exact key.
      - name: Save AVD cache
        if: always() && steps.creds.outputs.skip == 'false' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Save Gradle cache
        if: always() && steps.creds.outputs.skip == 'false' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save E2E APK cache
        if: always() && steps.creds.outputs.skip == 'false' && steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}
