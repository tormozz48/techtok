name: Mobile emulator E2E

# Drives the app itself on an Android emulator via Maestro
# (packages/e2e/maestro), using the sign-in bypass flag a local run uses
# (apps/mobile/src/state/e2eAuth.ts). Deliberately manual-dispatch only: UI
# flows are flake-prone and shouldn't block e2e.yml's schedule or ci.yml.
# Uses e2e.yml's api-contract Google test secrets — skips cleanly without them.
on:
  workflow_dispatch:

concurrency:
  group: mobile-emulator-e2e
  cancel-in-progress: false

jobs:
  mobile-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Google test credentials are provisioned
        id: creds
        run: |
          if [ -z "${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}" ]; then
            echo "GOOGLE_TEST_REFRESH_TOKEN is not set — skipping the mobile emulator suite (see packages/e2e/src/googleTestAuth.ts)." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # D100: production is the only deployed stage now. Discovered rather
      # than read from PRODUCTION_API_URL so a stale variable can't misdirect
      # a Maestro run.
      - name: Discover the API endpoint
        if: steps.creds.outputs.skip == 'false'
        id: api
        run: echo "url=$(pnpm exec tsx packages/e2e/scripts/discoverApiUrl.ts)" >> "$GITHUB_OUTPUT"

      - name: Mint a Google ID token for the E2E test account
        if: steps.creds.outputs.skip == 'false'
        env:
          GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
        run: |
          ID_TOKEN="$(pnpm exec tsx packages/e2e/scripts/mintIdToken.ts)"
          echo "::add-mask::$ID_TOKEN"
          echo "ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      # restore/save split (not combined actions/cache@v4) for all three
      # caches here: the combined action saves from a post hook GitHub skips
      # once any later step fails, so a failing Maestro run cached nothing.
      # The explicit `save` steps below carry `if: always()` instead.
      # Keyed on everything that changes the APK, including the API endpoint.
      - name: Restore Gradle cache
        if: steps.creds.outputs.skip == 'false'
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore E2E APK cache
        if: steps.creds.outputs.skip == 'false'
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: mobile-e2e-apk-${{ hashFiles('apps/mobile/src/**', 'apps/mobile/android/**', 'packages/shared/src/**', 'pnpm-lock.yaml') }}-${{ steps.api.outputs.url }}

      - name: Build E2E APK
        if: steps.creds.outputs.skip == 'false' && steps.apk-cache.outputs.cache-hit != 'true'
        env:
          TECHTOK_E2E_API_URL: ${{ steps.api.outputs.url }}
          TECHTOK_E2E_ARCH: x86_64
        run: pnpm --filter @techtok/e2e run build-mobile-e2e-apk

      - name: Upload APK artifact
        if: steps.creds.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ubuntu-latest supports KVM but /dev/kvm isn't world-writable —
      # https://github.com/ReactiveCircus/android-emulator-runner#usage
      - name: Enable KVM
        if: steps.creds.outputs.skip == 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore AVD cache
        if: steps.creds.outputs.skip == 'false'
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Key includes the profile: force-avd-creation is false, so without
          # a key bump a stale small-profile AVD would win.
          key: avd-34-google_apis-x86_64-pixel_6

      - name: Create AVD snapshot (cache miss only)
        if: steps.creds.outputs.skip == 'false' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A real device profile, not the action's 320x640 default — content
          # was genuinely off-screen and beyond Maestro's bounded auto-scroll.
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      # $GITHUB_PATH, not `export`: the emulator action's `script:` runs each
      # line in its own shell, so an exported PATH is gone by the next line.
      - name: Install Maestro
        if: steps.creds.outputs.skip == 'false'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        if: steps.creds.outputs.skip == 'false'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test packages/e2e/maestro/flows -e APP_ID=com.tormozz48dev.techtok -e ID_TOKEN="$ID_TOKEN"

      # `if: always()` is the point of the split — see the restore comment.
      # `cache-hit != 'true'` skips a redundant upload on an exact match.
      - name: Save AVD cache
        if: always() && steps.creds.outputs.skip == 'false' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Save Gradle cache
        if: always() && steps.creds.outputs.skip == 'false' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save E2E APK cache
        if: always() && steps.creds.outputs.skip == 'false' && steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}
