name: Mobile release (Play Store)

# Builds the `production` eas.json profile as a Play-uploadable AAB and, when
# PlayServiceAccountKey exists, submits it to Play's `internal` track. Called
# by ci.yml (D98) on the same should_build gate as mobile-build.yml, in
# parallel with it (D99). workflow_dispatch stays for an ad hoc rebuild.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Production API URL to bake into the build (EXPO_PUBLIC_API_URL)
        required: true
        type: string
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string

concurrency:
  group: mobile-release
  cancel-in-progress: false # never cancel a Play-bound build mid-run

jobs:
  production-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # secrets can't be referenced in a step-level `if:` — mirror into env.
      HAS_PLAY_KEY: ${{ secrets.PlayServiceAccountKey != '' }}
    steps:
      # ref: main, not github.sha — this must embed the versionCode
      # mobile-version-bump just pushed (D44), not the pre-bump commit.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # RN 0.86 / Android Gradle Plugin require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pins cmdline-tools and accepts licenses for Gradle's package fetches.
      - uses: android-actions/setup-android@v3

      # Installs eas-cli and authenticates via EXPO_TOKEN (a free Expo account).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `eas build --local` drives Gradle directly and skips apps/mobile's
      # package.json scripts, so this guard needs its own explicit step.
      - name: Check production API URL
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: pnpm check-api-url

      # Caches ~/.gradle (where `eas build --local` runs Gradle from).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # `--local` builds on this runner (no EAS credit). Signing credentials
      # come from EAS via EXPO_TOKEN — the `production` profile's keystore
      # must exist first (`npx eas-cli credentials --platform android`,
      # maintainer, one time); it becomes the permanent Play upload key.
      # SENTRY_ORG/SENTRY_PROJECT are required, not optional: without them the
      # release-bundle task fails the whole build on a missing org slug.
      # EAS_LOCAL_BUILD_WORKINGDIR pins a stable path for the Gradle cache.
      - name: Build Android App Bundle (eas build --local)
        working-directory: apps/mobile
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: /home/runner/eas-local-build
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          SENTRY_ORG: tormozz48
          SENTRY_PROJECT: react-native
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: eas build --platform android --profile production --local --non-interactive --output "${{ github.workspace }}/techtok.aab"

      # Always keep a downloadable copy — the only way to recover a build if
      # the Play upload fails, and the only way to get the AAB at all before
      # PlayServiceAccountKey exists (D98).
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: techtok-${{ github.run_number }}.aab
          path: ${{ github.workspace }}/techtok.aab

      # D98: auto-submits to Play's `internal` track once
      # PlayServiceAccountKey (D71) exists; a clean skip until then. `internal`
      # has no review and is where phase 23's first Play-signed upload must
      # land (D68's SHA-1 ordering trap). The app must already exist in Play
      # Console with App Signing on — the API uploads releases, not apps.
      - name: Publish to Google Play (internal track)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PlayServiceAccountKey }}
          packageName: com.tormozz48dev.techtok
          releaseFiles: ${{ github.workspace }}/techtok.aab
          tracks: internal
          status: completed
