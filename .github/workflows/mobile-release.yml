name: Mobile release (Play Store)

# Builds the `production` eas.json profile as a Play-uploadable AAB and, when
# PlayServiceAccountKey exists, submits it to the Play Console `internal`
# track via the Play Developer API. `workflow_call` is step 6 of ci.yml's
# main-branch pipeline (D98) — the same should_build gate as mobile-build.yml,
# so this only runs when a merge actually needs a new native build.
# `workflow_dispatch` stays for an ad hoc rebuild against a specific API URL.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Production API URL to bake into the build (EXPO_PUBLIC_API_URL)
        required: true
        type: string
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string

concurrency:
  group: mobile-release
  cancel-in-progress: false # never cancel a Play-bound build mid-run

jobs:
  production-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # secrets can't be referenced directly in a step-level `if:` — mirror
      # it into env, same pattern ci.yml's mobile-ota-update job uses for
      # HAS_SENTRY_TOKEN.
      HAS_PLAY_KEY: ${{ secrets.PlayServiceAccountKey != '' }}
    steps:
      # ref: main, not the default `github.sha`: when called from ci.yml this
      # job runs after mobile-build.yml's version-bump step has already
      # pushed a new commit to main (D44), and this build must embed that
      # same bumped versionCode/versionName, not the pre-bump commit that
      # triggered the pipeline.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # RN 0.86 / Android Gradle Plugin require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK/NDK; this pins cmdline-tools and
      # accepts licenses so Gradle can fetch any missing package for the build.
      - uses: android-actions/setup-android@v3

      # Installs eas-cli and authenticates via EXPO_TOKEN (a free Expo account).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `eas build --local` doesn't run apps/mobile's own package.json scripts
      # (it drives Gradle directly), so the guard normally wired into
      # build:android/build:android:apk has to run as its own explicit step
      # here — same script, same env var, checked before it's baked in rather
      # than after.
      - name: Check production API URL
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: pnpm check-api-url

      # Reuse the Gradle distribution + Maven deps + build-cache across runs.
      # `eas build --local` runs Gradle from the home GRADLE_USER_HOME (~/.gradle),
      # so caching that here skips the big first-time downloads and recompiles.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # `--local` runs the build on this runner (no EAS cloud-build credit
      # consumed). Signing credentials come from EAS's remote credential store
      # (credentialsSource defaults to "remote") via EXPO_TOKEN — no keystore
      # file or keystore secret in GitHub. Before this can succeed once, the
      # `production` profile needs credentials established on EAS: run
      # `npx eas-cli credentials --platform android` once (maintainer, needs an
      # EAS login), select the `production` profile, let EAS generate/store a
      # keystore for it. That keystore is what becomes the permanent Play
      # upload key. SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN mirror
      # mobile-build.yml's already-working preview build exactly — without
      # them the sentry-android-gradle-plugin's release-bundle task fails the
      # whole build on "An organization ID or slug is required", not a soft
      # skip (learned from this workflow's first real run). EAS_LOCAL_BUILD_WORKINGDIR
      # pins the build to a fixed path so the Gradle cache above actually
      # hits, same reasoning as mobile-build.yml.
      - name: Build Android App Bundle (eas build --local)
        working-directory: apps/mobile
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: /home/runner/eas-local-build
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          SENTRY_ORG: tormozz48
          SENTRY_PROJECT: react-native
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: eas build --platform android --profile production --local --non-interactive --output "${{ github.workspace }}/techtok.aab"

      # Always keep a downloadable copy regardless of whether the Play upload
      # below ran — the one non-optional way to recover a build if the Play
      # API call fails after a successful compile, and the only way to get
      # the AAB at all before PlayServiceAccountKey exists (D98).
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: techtok-${{ github.run_number }}.aab
          path: ${{ github.workspace }}/techtok.aab

      # D98: auto-submits to Play's `internal` track via the Play Developer
      # API once PlayServiceAccountKey (D71, phase 21 task 2) exists — a
      # Google Cloud service account granted Release Manager access on this
      # app in Play Console. Until then this step is a clean skip, the same
      # convention this repo already uses for SENTRY_AUTH_TOKEN and the E2E
      # Google test credentials, so wiring this workflow into ci.yml is safe
      # before that secret is provisioned. `internal` rather than a higher
      # track: it has no review, is the safest default for an automated
      # pipeline, and is also the track phase 23 needs the very first
      # Play-managed-signing upload to land on before anything else can work
      # (the SHA-1 ordering trap, D68). Also requires the app to already
      # exist in Play Console with Play App Signing enabled (phase 23 track D
      # task 20) — the API can upload a release, not create the app.
      - name: Publish to Google Play (internal track)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PlayServiceAccountKey }}
          packageName: com.tormozz48dev.techtok
          releaseFiles: ${{ github.workspace }}/techtok.aab
          tracks: internal
          status: completed
