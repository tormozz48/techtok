name: Mobile version bump

# D43: computes a conventional-commit-driven semver bump for the mobile app
# and commits it onto the PR's OWN branch — never onto main, which branch
# protection blocks direct pushes to anyway, and which is exactly the ref
# D40/D41's now-retired post-merge automation raced against and broke on.
# scripts/bumpMobilePrVersion.ts only writes files; the actual commit+push is
# delegated to stefanzweifel/git-auto-commit-action rather than hand-rolled
# git shell, to avoid reintroducing a D40-style mechanism bug in a new script.
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"

permissions:
  contents: write

concurrency:
  group: mobile-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    # Fork PRs get a read-only GITHUB_TOKEN regardless of the permissions
    # block above, so a push from this job would just fail — skip explicitly
    # rather than fail loudly for something outside a fork contributor's control.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Checks out the PR branch tip itself (not the default merge-ref
      # commit), with full history so origin/<base> is available locally for
      # the script's `git show`/`git log <base>..HEAD`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute version bump
        id: bump
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          npx tsx scripts/bumpMobilePrVersion.ts
          echo "version=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")" >> "$GITHUB_OUTPUT"

      # No-ops cleanly (no commit created) if the script made no changes —
      # either no feat/fix commits since base, or a manual bump already won.
      - name: Commit version bump onto the PR branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(mobile): bump version to ${{ steps.bump.outputs.version }}"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          file_pattern: apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle
