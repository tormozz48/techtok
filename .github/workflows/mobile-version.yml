name: Mobile version bump

# Runs on merges to main that touch mobile-relevant paths (same filter
# mobile-build.yml uses) and bumps apps/mobile/app.json's version from the
# conventional-commit messages since the last mobile-v* tag (DESIGN §2 D35).
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"

concurrency:
  group: mobile-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: needed for `git log <tag>..HEAD` and `git describe`

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute and apply version bump
        run: npx tsx scripts/bumpMobileVersion.ts

      - name: Commit and tag if the version changed
        run: |
          if git diff --quiet -- apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle; then
            echo "No version bump needed."
            exit 0
          fi
          VERSION=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json apps/mobile/android/app/build.gradle
          git commit -m "chore(mobile): bump version to $VERSION"
          git tag "mobile-v$VERSION"
          git push origin HEAD:main --follow-tags
