name: Release cleanup

# D57: every merge adds an APK-carrying `android-build-*` release, so without
# this they accumulate forever. Keeps the 3 most recent (release + tag), and
# separately prunes `mobile-v*` tags (D42) to 3 via the Git refs API, since
# those are plain tags with no release attached. dry_run for an ad hoc sweep.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: release-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete releases and their tags
    steps:
      # No checkout: gh talks to the remote repo directly via GH_REPO/GH_TOKEN.
      - name: Delete stale android-build releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: "3"
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # Only `android-build-*` — any other release is never touched.
          # A truncated --limit under-deletes, never over-deletes.
          stale=$(gh release list --limit 200 --json tagName,createdAt \
            --jq "map(select(.tagName | startswith(\"android-build-\")))
                  | sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName")

          if [ -z "$stale" ]; then
            echo "Nothing to delete: at most ${KEEP} android-build-* releases exist."
            echo "Nothing to delete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=$(echo "$stale" | wc -l | tr -d ' ')
          echo "Keeping the ${KEEP} most recent android-build-* releases; ${count} to delete:"
          echo "$stale"

          {
            echo "### Release cleanup"
            echo "Kept the ${KEEP} most recent \`android-build-*\` releases."
            echo "Deleted ${count} (dry run: ${DRY_RUN}):"
            echo "$stale" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — nothing deleted."
            exit 0
          fi

          echo "$stale" | while read -r tag; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      # mobile-v* tags have no release attached, so the step above misses
      # them. mobile-changes (D53) only ever diffs against the newest one,
      # so pruning older ones is safe.
      - name: Delete stale mobile-v tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: "3"
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # --paginate for >100 tags; the API's ordering isn't chronological,
          # so sort -V explicitly (safe — every entry shares the prefix).
          all_tags=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name')
          stale=$(echo "$all_tags" | { grep '^mobile-v' || true; } | sort -rV | tail -n "+$((KEEP + 1))")

          if [ -z "$stale" ]; then
            echo "Nothing to delete: at most ${KEEP} mobile-v* tags exist."
            echo "Nothing to delete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=$(echo "$stale" | wc -l | tr -d ' ')
          echo "Keeping the ${KEEP} most recent mobile-v* tags; ${count} to delete:"
          echo "$stale"

          {
            echo "### Tag cleanup"
            echo "Kept the ${KEEP} most recent \`mobile-v*\` tags."
            echo "Deleted ${count} (dry run: ${DRY_RUN}):"
            echo "$stale" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — nothing deleted."
            exit 0
          fi

          echo "$stale" | while read -r tag; do
            echo "Deleting $tag"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
          done
