# Sign in -> skip onboarding -> Settings -> Account -> Sign Out -> back at
# the sign-in gate. Confirms Stack.Protected actually flips on signOut()
# (_layout.tsx) rather than leaving a stale authenticated screen on screen.
appId: ${APP_ID}
---
- runFlow: _signIn.yaml
# Skips onboarding when reached (see _signIn.yaml's comment on the confirmed
# real-device bug that currently bypasses it on every fresh sign-in anyway).
- tapOn:
    id: "onboarding-cta"
    optional: true
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "action-bar-settings"
- tapOn:
    id: "settings-account-link"
- tapOn:
    id: "account-sign-out"

- assertVisible:
    id: "auth-screen"
